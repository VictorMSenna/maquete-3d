<!doctype html>
<html lang="pt-BR" data-estado="carregando">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apartamento ilustrativo · tour 360</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23f2c14e'/%3E%3C/svg%3E">
<style>
  /* Inter as local files (SIL OFL 1.1: assets/fontes/inter-OFL.txt), the same faces and subsets the building module ships; no request to a font server. */
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(./assets/fontes/inter-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(./assets/fontes/inter-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root { --fundo: #0b0e1a; --vidro: rgba(14, 17, 28, .72); --borda: rgba(255, 255, 255, .16); --texto: #f4f2ee; --texto-2: rgba(244, 242, 238, .72);
          --ouro: #f2c14e; color-scheme: dark;
          /* font stacks of the building module (its sun bar uses them) */
          --f-body: "Inter", "Gill Sans", "Segoe UI", Roboto, Arial, sans-serif; --f-mono: "Inter", "Segoe UI", Roboto, Arial, sans-serif; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto); font: 14px/1.4 var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  #palco { position: fixed; inset: 0; }
  .vidro { background: var(--vidro); border: 1px solid var(--borda); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #barra { position: fixed; left: 12px; top: 12px; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 14px; border-radius: 999px;
           max-width: calc(100% - 24px); box-sizing: border-box; }
  #barra b { font-weight: 700; white-space: nowrap; }
  .selo { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ouro); border: 1px solid rgba(242, 193, 78, .5); border-radius: 999px;
          padding: 2px 8px; white-space: nowrap; }
  #btn-det { font: inherit; font-weight: 600; color: var(--texto); background: rgba(255, 255, 255, .1); border: 1px solid var(--borda); border-radius: 999px;
             padding: 6px 12px; cursor: pointer; }
  #det { position: fixed; z-index: 30; right: 12px; top: 64px; width: min(360px, calc(100% - 24px)); box-sizing: border-box; border-radius: 16px; padding: 16px 18px; }
  #det h2 { margin: 0 0 4px; font-size: 20px; } #det .sub { color: var(--texto-2); margin: 0 0 12px; }
  #det ul { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 4px; } #det li { display: flex; justify-content: space-between; gap: 12px; }
  #det li span:last-child { color: var(--texto-2); white-space: nowrap; }
  #det .nota { font-size: 12.5px; color: var(--texto-2); margin: 0; }
  #det-fechar { position: absolute; right: 10px; top: 8px; font: 20px/1 system-ui; color: var(--texto); background: none; border: 0; cursor: pointer; padding: 6px; }
  #cred { position: fixed; left: 50%; transform: translateX(-50%); bottom: 6px; z-index: 15; font-size: 11px; color: #fff; background: rgba(11, 14, 26, .55);
          padding: 3px 8px; border-radius: 6px; pointer-events: none; white-space: nowrap; }

  /* ---- Sun bar: the same control the building module shows in its tour (src/sol.js = that module's file, byte for byte) and the same style rules
          as its page, copied verbatim below (.sol-ctl ... .sol-nota, .sol-ico). Only the holder (#sol) is ours: fixed at the bottom centre. ---- */
  #sol { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: min(860px, calc(100% - 24px)); }
  body:has(#cred:not([hidden])) #sol { bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); }   /* our own credit line, when the page draws it */
  .sol-ico { width: 14px; height: 14px; border-radius: 50%; background: #f4c45a; box-shadow: 0 0 0 3px rgba(244,196,90,.25); flex: none; }
  .sol-ctl { display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 7px; border-radius: 999px; background: rgba(16,18,17,.62); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 8px 26px rgba(0,0,0,.3); min-height: 56px; color: #f1ede6; }
  .sol-btn { display: inline-flex; align-items: center; gap: 7px; min-height: 42px; padding: 0 14px; border-radius: 999px; border: 0; background: #f4c45a; color: #1c1404; font-weight: 700; font-size: 13.5px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; flex: none; }
  .sol-btn .sol-ico { background: #1c1404; box-shadow: none; width: 9px; height: 9px; }
  .sol-ctl.andando .sol-btn { box-shadow: 0 0 0 4px rgba(244,196,90,.35); }
  .sol-relogio { display: grid; line-height: 1.05; flex: none; min-width: 0; max-width: 118px; }
  @media (min-width: 1000px) { .sol-relogio { max-width: 250px; } }
  @media (min-width: 1000px) and (max-width: 1279px) { .sol-relogio { max-width: 150px; } .sol-sub { white-space: normal; line-height: 1.2; } }
  .sol-ctl.fino .sol-range::-webkit-slider-thumb { box-shadow: 0 0 0 6px rgba(244,196,90,.45); }
  .sol-hora { font: 600 22px var(--f-mono); letter-spacing: -.03em; }
  .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .sol-sub { font-size: 10.5px; color: rgba(241,237,230,.66); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sol-trilho { position: relative; flex: 1 1 auto; min-width: 140px; height: 44px; --nasce: 25%; --poe: 75%; --meio: 50%; }
  .sol-trilho::before { content: ""; position: absolute; left: 12px; right: 12px; top: 50%; height: 8px; transform: translateY(-50%); border-radius: 8px; pointer-events: none;
    background: linear-gradient(90deg, #0f1830 0%, #1d2a4d calc(var(--nasce) - 5%), #e7a26b var(--nasce), #f2d48e calc(var(--nasce) + 6%), #fbe6a6 var(--meio), #f2d48e calc(var(--poe) - 6%), #e48d5c var(--poe), #1d2a4d calc(var(--poe) + 5%), #0f1830 100%); }
  .sol-range { position: absolute; inset: 0; width: 100%; height: 44px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; touch-action: none; }
  .sol-range::-webkit-slider-runnable-track { height: 44px; background: transparent; }
  .sol-range::-moz-range-track { height: 44px; background: transparent; }
  .sol-range::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: 10px; border-radius: 50%; background: #fff; border: 3px solid #f4c45a; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .sol-range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid #f4c45a; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .sol-range:focus-visible { outline: none; }
  .sol-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(143,184,169,.7); }
  .sol-marcas { position: absolute; top: 0; bottom: 0; left: 12px; right: 12px; pointer-events: none; }
  .sol-marcas i { position: absolute; top: 9px; width: 2px; height: 8px; background: rgba(255,255,255,.75); border-radius: 1px; }
  .sol-marcas .m-nasce { left: var(--nasce); } .sol-marcas .m-poe { left: var(--poe); }
  .sol-marcas .m-txt { position: absolute; bottom: -1px; font: 500 9px var(--f-mono); color: rgba(241,237,230,.55); transform: translateX(-50%); }
  .m-txt.m0 { left: 0; } .m-txt.m12 { left: 50%; } .m-txt.m24 { left: 100%; }
  .sol-marcas i { transform: translateX(-1px); }
  .sol-est { flex: none; min-height: 34px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #f1ede6; font: 600 12.5px var(--f-body); padding: 0 10px; }
  .sol-est option { background: #181b19; color: #f1ede6; }
  .sol-dica { position: absolute; left: 14px; top: -24px; font-size: 11.5px; color: #f4c45a; background: rgba(16,18,17,.7); padding: 2px 8px; border-radius: 999px; pointer-events: none; }
  .sol-ctl { position: relative; }
  @media (max-width: 760px) {
    .sol-ctl { flex-wrap: wrap; border-radius: 22px; gap: 4px 10px; padding: 8px 10px; }
    .sol-relogio { flex: 1; max-width: none; }
    .sol-hora { font-size: 20px; }
    .sol-sub { white-space: normal; line-height: 1.2; }
    .sol-trilho { order: 5; flex-basis: 100%; }
    .sol-btn { min-height: 40px; padding: 0 12px; }
  }
  .sol-nota { margin: 0; font-size: 10.5px; color: var(--texto-2); }
  /* ---- end of the shared sun bar rules ---- */

  /* the tour's "i" button sits above the bar (same offsets as the building module: 84 px, 160 px on narrow screens where the bar wraps in two rows);
     its opened label goes over the room buttons for the 6 s it stays open */
  #palco .t360-rot { bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); }
  #palco .t360-rot.aberto { z-index: 5; }
  @media (max-width: 1000px) { #palco .t360-rot { left: auto; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); } }   /* right side: the bar hint sits at its left */
  /* short screens (phone held sideways): the light buttons go in one row under the top bar instead of a column that reached the walk buttons */
  @media (max-height: 520px) and (min-width: 761px) { #palco .t360-luzes { top: 70px !important; left: 12px; right: auto; flex-direction: row; flex-wrap: wrap; gap: 4px; } #palco .t360-luzes button { padding: 4px 10px; }
    #palco .t360-nome { top: 12px !important; left: auto !important; right: 12px; transform: none !important; } }   /* the room name goes to the top right, beside the bar */
  /* MORADIA-CONSERTO D10: the room name sat under the top bar below ~1200 px */
  @media (max-width: 1200px) and (min-width: 561px) { .t360-nome { top: 64px !important; } }
  #barra-ponto { display: none; }
  /* Phones: two thin rows on top (room name + label + details; one row of short light buttons), the walk buttons right above the sun bar, the "i" on the hint row.
     The picture keeps the middle of the screen and no group can reach another. */
  @media (max-width: 760px) {
    #barra { top: 8px; left: 8px; right: 8px; max-width: none; gap: 6px; padding: 3px 3px 3px 12px; font-size: 12.5px; }
    #barra b, #palco .t360-nome, .selo .so-largo { display: none !important; }
    #barra-ponto { display: block; flex: 1 1 auto; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .selo { flex: none; font-size: 10px; padding: 1px 6px; }
    #btn-det { flex: none; padding: 3px 10px; font-size: 12px; }
    #det { top: 46px; right: 8px; width: min(360px, calc(100% - 16px)); }
    #palco .t360-luzes { top: 44px !important; left: 8px; right: 8px; flex-direction: row; flex-wrap: wrap; gap: 4px; }
    #palco .t360-luzes button { padding: 3px 9px; font-size: 11.5px; line-height: 1.3; }
    #palco .t360-luzes .l-longo { display: none; }
    #palco .t360-luzes .l-curto { display: inline; }
    #palco .t360-rot { left: auto; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); }
    body:has(#cred:not([hidden])) #palco .t360-rot { bottom: calc(env(safe-area-inset-bottom, 0px) + 138px); }
    @media (max-width: 370px) { #palco .t360-rot { bottom: calc(env(safe-area-inset-bottom, 0px) + 128px); } body:has(#cred:not([hidden])) #palco .t360-rot { bottom: calc(env(safe-area-inset-bottom, 0px) + 146px); } }
    #palco .t360-chip { min-height: 30px; padding: 0 10px; gap: 4px; font-size: 11.5px; }
    .t360-g3d-carga { top: 76px !important; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./src/vendor/three@0.186.1/build/three.module.min.js",
    "./src/vendor/three@0.186.1/build/three.core.js": "./src/vendor/three@0.186.1/build/three.core.min.js",
    "three/addons/": "./src/vendor/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="palco" aria-label="Tour 360 do apartamento ilustrativo"></div>
<div id="barra" class="vidro">
  <b>Apartamento ilustrativo · <span id="area">183</span> m²</b>
  <span id="barra-ponto" aria-hidden="true"></span>
  <span class="selo"><span class="so-largo">projeto </span>ilustrativo</span>
  <button type="button" id="btn-det" aria-expanded="false" aria-controls="det">Detalhes</button>
</div>
<section id="det" class="vidro" hidden aria-label="Detalhes do apartamento">
  <button type="button" id="det-fechar" aria-label="Fechar">×</button>
  <h2>Apartamento ilustrativo</h2>
  <p class="sub"><span id="det-area">183</span> m² de área privativa</p>
  <ul id="det-amb"></ul>
  <p class="nota">Projeto ilustrativo, criado sem nenhuma foto ou vídeo.</p>
</section>
<div id="sol" role="group" aria-label="Hora do dia e estação"></div>
<div id="cred">Apartamento: render ilustrativo</div>
<script type="module" src="./src/moradia.js"></script>
</body>
</html>
