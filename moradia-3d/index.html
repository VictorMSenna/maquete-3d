<!doctype html>
<html lang="pt-BR" data-estado="carregando">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apartamento ilustrativo · tour 360</title>
<style>
  :root { --fundo: #0b0e1a; --vidro: rgba(14, 17, 28, .72); --borda: rgba(255, 255, 255, .16); --texto: #f4f2ee; --texto-2: rgba(244, 242, 238, .72);
          --ouro: #f2c14e; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
               overflow: hidden; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  #palco { position: fixed; inset: 0; }
  .vidro { background: var(--vidro); border: 1px solid var(--borda); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #barra { position: fixed; left: 12px; top: 12px; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 14px; border-radius: 999px;
           max-width: calc(100% - 24px); box-sizing: border-box; }
  #barra b { font-weight: 700; white-space: nowrap; }
  .selo { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ouro); border: 1px solid rgba(242, 193, 78, .5); border-radius: 999px;
          padding: 2px 8px; white-space: nowrap; }
  #btn-det { font: inherit; font-weight: 600; color: var(--texto); background: rgba(255, 255, 255, .1); border: 1px solid var(--borda); border-radius: 999px;
             padding: 6px 12px; cursor: pointer; }
  #det { position: fixed; z-index: 30; right: 12px; top: 64px; width: min(360px, calc(100% - 24px)); box-sizing: border-box; border-radius: 16px; padding: 16px 18px; }
  #det h2 { margin: 0 0 4px; font-size: 20px; } #det .sub { color: var(--texto-2); margin: 0 0 12px; }
  #det ul { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 4px; } #det li { display: flex; justify-content: space-between; gap: 12px; }
  #det li span:last-child { color: var(--texto-2); white-space: nowrap; }
  #det .nota { font-size: 12.5px; color: var(--texto-2); margin: 0; }
  #det-fechar { position: absolute; right: 10px; top: 8px; font: 20px/1 system-ui; color: var(--texto); background: none; border: 0; cursor: pointer; padding: 6px; }
  #cred { position: fixed; left: 50%; transform: translateX(-50%); bottom: 6px; z-index: 15; font-size: 11px; color: #fff; background: rgba(11, 14, 26, .55);
          padding: 3px 8px; border-radius: 6px; pointer-events: none; white-space: nowrap; }
  #sol { position: fixed; left: 50%; transform: translateX(-50%); bottom: 30px; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 8px 12px;
         border-radius: 18px; width: min(640px, calc(100% - 24px)); box-sizing: border-box; }
  #hora-txt { font: 700 20px/1 system-ui; min-width: 58px; font-variant-numeric: tabular-nums; }
  #hora { flex: 1; min-width: 80px; accent-color: var(--ouro); }
  #estacao { font: inherit; color: var(--texto); background: rgba(255, 255, 255, .1); border: 1px solid var(--borda); border-radius: 999px; padding: 6px 10px; }
  @media (max-width: 560px) {
    #barra { gap: 4px 8px; font-size: 12.5px; padding: 6px 6px 6px 12px; flex-wrap: wrap; border-radius: 16px; right: 12px; } .selo { font-size: 10px; padding: 2px 6px; }
    #btn-det { padding: 4px 10px; margin-left: auto; }
    #sol { bottom: 28px; gap: 8px; } #hora-txt { font-size: 17px; min-width: 48px; }
    /* the tour's light chips sit at the top right: move them under our bar on phones */
    .t360-luzes, .t360-chips { top: 92px !important; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./src/vendor/three@0.186.1/build/three.module.min.js",
    "./src/vendor/three@0.186.1/build/three.core.js": "./src/vendor/three@0.186.1/build/three.core.min.js",
    "three/addons/": "./src/vendor/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="palco" aria-label="Tour 360 do apartamento ilustrativo"></div>
<div id="barra" class="vidro">
  <b>Apartamento ilustrativo · <span id="area">183</span> m²</b>
  <span class="selo">projeto ilustrativo</span>
  <button type="button" id="btn-det" aria-expanded="false" aria-controls="det">Detalhes</button>
</div>
<section id="det" class="vidro" hidden aria-label="Detalhes do apartamento">
  <button type="button" id="det-fechar" aria-label="Fechar">×</button>
  <h2>Apartamento ilustrativo</h2>
  <p class="sub"><span id="det-area">183</span> m² de área privativa</p>
  <ul id="det-amb"></ul>
  <p class="nota">Projeto ilustrativo, criado sem nenhuma foto ou vídeo.</p>
</section>
<div id="sol" class="vidro" role="group" aria-label="Hora do dia e estação">
  <span id="hora-txt">09:00</span>
  <input id="hora" type="range" min="300" max="1380" step="5" value="540" aria-label="Hora do dia">
  <select id="estacao" aria-label="Estação">
    <option value="primavera">Primavera</option><option value="verao">Verão</option><option value="outono">Outono</option><option value="inverno">Inverno</option>
  </select>
</div>
<div id="cred">Vista da janela: imagem ilustrativa · apartamento: render ilustrativo</div>
<script type="module" src="./src/moradia.js"></script>
</body>
</html>
